<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, #E40DB0">
  <title>Lia Bolos & Decorados</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo-nome">
      <img src="img/Logo_principal_instagram 1000x1000.jpg" alt="Lia Bolos Decorados" class="logo">
      <h1>Cardápio Digital Lia Bolos Decorados</h1>
    </div>
  </header>

  <main id="cardapio" class="cardapio">
    <nav class="menu">
      <a class="btn-categoria" href="#bolo-decorado">Bolos Decorados</a>
      <a class="btn-categoria" href="#doces">Doces</a>
    </nav>
    <section id="bolo-decorado" class="categoria">
      <h2>Bolos Decorados</h2>
      <div class="lista-produtos" id="lista-bolo-decorado"></div>
    </section>

    <section id="doces" class="categoria">
      <h2>Doces</h2>
      <div class="lista-produtos" id="lista-doces"></div>
    </section>
  </main>

<!-- Botão Fixo carrinho -->
<button id="btn-carrinho" disabled>
  <img src="img/carrinho.png" alt="WhatsApp">
  <div id="notificacao-carrinho">0</div>
</button>


<footer class="rodape">
    <div class="contato-item">
      <a href="https://www.instagram.com/lmbolosdecorados?igsh=MW5nNnZkdWo2ZjQwbg==">
        <img src="img/instagram.png" alt="Instagram">
        <span>lmbolosdecorados</span>
      </a>
    </div>
    <div class="contato-item">
      <img src="img/facebook.png" alt="Facebook">
      <span>lmbolosdecorados</span>
    </div>
    <div class="contato-item">
      <a href="https://wa.link/gs79ff">
        <img src="img/whatsapp.png" alt="WhatsApp">
        <span>(98) 9 9227-8315</span>
      </a>
    </div>
</footer>

  <script src="js/lista-produtos.js"></script>
  <script src="js/script_cardapio.js"></script>
</body>
</html>
